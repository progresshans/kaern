# Kaern's releases. Pushing a version tag builds the app on a GitHub Mac, signs it with the Developer ID, notarizes it,
# publishes the DMG and the ZIP as a GitHub release, then adds it to the appcast that offers updates (appcast.xml on the
# gh-pages branch, which GitHub Pages serves):
# - v1.1.0 makes a release, offered to every copy;
# - v1.1.0-beta.2 makes a beta: a GitHub pre-release, offered only to copies with Get beta versions on.
#
# The same build, signed ad hoc and with no secrets, runs on each push to main (ci.yml).
#
# The setup (the release environment and its secrets) is in Packaging/README.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and notarize
    # GitHub's macOS 27 image with its default Xcode 27, as in ci.yml. It's a public preview, named xcode-27 until
    # GitHub releases a macos-27 label; then change runs-on in both.
    runs-on: xcode-27
    timeout-minutes: 90
    # The secrets are this environment's: limit it to v* tags in the settings.
    environment: release
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      appcast_base: ${{ steps.tag.outputs.appcast_base }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main: only commits on main are released"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-beta.* ]]; then prerelease=true; else prerelease=false; fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # script/release.sh builds this version (and its build number) instead of the project's.
          echo "KAERN_VERSION=$version" >> "$GITHUB_ENV"
          # The appcast as published, which the release is added to. Publishing checks that it hasn't changed since.
          echo "appcast_base=$(git rev-parse -q --verify origin/gh-pages:appcast.xml || echo none)" >> "$GITHUB_OUTPUT"
          xcodebuild -version

      - name: Put the Developer ID certificate in a keychain of this run
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/kaern-release.keychain-db"
          password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/developer-id.p12"
          trap 'rm -f "$p12"' EXIT
          printf '%s' "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          echo "KAERN_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Store the notarization key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$NOTARY_KEY" > "$key"
          xcrun notarytool store-credentials progresshans-notary --keychain "$KAERN_NOTARY_KEYCHAIN" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"

      - name: Build, sign, notarize and package
        env:
          KAERN_NOTARY_PROFILE: progresshans-notary
        run: ./script/release.sh

      - name: Add the release to the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$key"
          KAERN_SPARKLE_KEY_FILE="$key" ./script/release.sh appcast

      - name: Keep the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/${{ steps.tag.outputs.version }}/Kaern-${{ steps.tag.outputs.version }}.dmg
            release/${{ steps.tag.outputs.version }}/Kaern-${{ steps.tag.outputs.version }}.zip
            release/${{ steps.tag.outputs.version }}/SHA256SUMS
            release/${{ steps.tag.outputs.version }}/notes.md
            release/${{ steps.tag.outputs.version }}/appcast.xml
          if-no-files-found: error
          retention-days: 30

      - name: Remove the keychain
        if: always()
        run: |
          if [[ -n "${KAERN_NOTARY_KEYCHAIN:-}" ]]; then security delete-keychain "$KAERN_NOTARY_KEYCHAIN" || true; fi

  publish:
    name: Publish the release and the appcast
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      PRERELEASE: ${{ needs.build.outputs.prerelease }}
      APPCAST_BASE: ${{ needs.build.outputs.appcast_base }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Its credentials stay, to push gh-pages.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      # First the files, then the appcast that points at them. Both steps can run again after a failure.
      - name: Publish the GitHub release
        run: |
          set -euo pipefail
          files=("$RUNNER_TEMP/release/Kaern-$VERSION.dmg" "$RUNNER_TEMP/release/Kaern-$VERSION.zip" "$RUNNER_TEMP/release/SHA256SUMS")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            options=(--verify-tag --title "Kaern $VERSION" --notes-file "$RUNNER_TEMP/release/notes.md")
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${files[@]}" "${options[@]}"
          fi

      - name: Publish the appcast on gh-pages
        run: |
          set -euo pipefail
          appcast="$RUNNER_TEMP/release/appcast.xml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin gh-pages; then
            current="$(git rev-parse -q --verify FETCH_HEAD:appcast.xml || echo none)"
            if [[ "$current" == "$(git hash-object "$appcast")" ]]; then
              echo "The appcast already offers $VERSION."
              exit 0
            fi
            if [[ "$current" != "$APPCAST_BASE" ]]; then
              echo "::error::The appcast on gh-pages changed while $VERSION was being built: run the whole workflow again"
              exit 1
            fi
            git switch -q --detach FETCH_HEAD
          else
            if [[ "$APPCAST_BASE" != none ]]; then
              echo "::error::Couldn't fetch gh-pages, which had the appcast when $VERSION was built"
              exit 1
            fi
            # The first release: the branch starts with the appcast alone.
            git switch -q --orphan gh-pages
          fi
          cp "$appcast" appcast.xml
          touch .nojekyll
          git add appcast.xml .nojekyll
          git commit -q -m "Offer $VERSION as an update"
          git push -q origin HEAD:refs/heads/gh-pages
          echo "The appcast offers $VERSION."

      - name: Ask GitHub Pages to serve it
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null \
            || echo "::warning::GitHub Pages took no build request: check Settings › Pages (Deploy from a branch, gh-pages, / (root))"
